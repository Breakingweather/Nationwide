function toggleEvent(el){
el.classList.toggle('on');
const name=el.getAttribute('data-name');
const on=el.classList.contains('on');
document.querySelectorAll('.warn-card').forEach(c=>{
const ev=c.getAttribute('data-event')||'';

}
});
}
function resetAllToggles(){
document.querySelectorAll('.switch').forEach(s=>s.classList.add('on'));

async function initMiniMaps(list){
if(miniMapsInitialized) return;
miniMapsInitialized=true;
for(let i=0;i<Math.min(list.length,120);i++){
const f=list[i];
const p=f.properties;
const ev=p.event||'';
const color=getTugaColor(ev);
const geom=await getGeomWithZones(f);
const mapId=`mini-map-${i}`;
const el=document.getElementById(mapId);
if(!el) continue;
try{
const m=L.map(mapId,{zoomControl:true,attributionControl:false}).setView([39,-98],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OSM'}).addTo(m);
L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0r-900913/{z}/{x}/{y}.png',{opacity:0.6,maxZoom:18}).addTo(m);
let has=false;
if(geom && geom.coordinates){
if(geom.type==='Polygon'){
const latlngs=geom.coordinates[0].map(c=>[c[1],c[0]]);
const poly=L.polygon(latlngs,{color:color,weight:4,fillColor:color,fillOpacity:0.35}).addTo(m);
m.fitBounds(poly.getBounds(),{padding:[10,10]});
has=true;
}else if(geom.type==='MultiPolygon'){
let b=null;
geom.coordinates.forEach(pc=>{
const ring=pc[0].map(c=>[c[1],c[0]]);
const poly=L.polygon(ring,{color:color,weight:4,fillColor:color,fillOpacity:0.35}).addTo(m);
if(!b) b=poly.getBounds(); else b.extend(poly.getBounds());
});
if(b){m.fitBounds(b,{padding:[10,10]});has=true;}
}
}
if(!has){m.setView([39.5,-98.35],4);}
setTimeout(()=>{try{m.invalidateSize();}catch(e){}},600);
miniMaps[mapId]=m;
}catch(e){}
}
}
async function getGeomWithZones(feature){
if(feature.geometry && feature.geometry.coordinates) return feature.geometry;
const zones=feature.properties && feature.properties.affectedZones;
if(!zones || zones.length===0) return null;
for(let z=0;z<Math.min(zones.length,5);z++){
try{
const r=await fetch(zones[z]);
const j=await r.json();
if(j.geometry && j.geometry.coordinates) return j.geometry;
if(j.features && j.features[0] && j.features[0].geometry) return j.features[0].geometry;
}catch(e){continue;}
}
return null;
}

if(cat==='All') r.style.display='';

function initLeafletMap(geom,color){
if(leafletMap){leafletMap.remove();leafletMap=null;}
leafletMap=L.map('modal-map',{zoomControl:true}).setView([39,-98],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OSM'}).addTo(leafletMap);
L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0r-900913/{z}/{x}/{y}.png',{opacity:0.65,maxZoom:18}).addTo(leafletMap);
let has=false;
if(geom && geom.coordinates){
try{
if(geom.type==='Polygon'){
const latlngs=geom.coordinates[0].map(c=>[c[1],c[0]]);
const poly=L.polygon(latlngs,{color:color,weight:5,fillColor:color,fillOpacity:0.3}).addTo(leafletMap);
leafletMap.fitBounds(poly.getBounds(),{padding:[20,20]});
has=true;
}else if(geom.type==='MultiPolygon'){
let b=null;
geom.coordinates.forEach(pc=>{
const ring=pc[0].map(c=>[c[1],c[0]]);
const poly=L.polygon(ring,{color:color,weight:5,fillColor:color,fillOpacity:0.3}).addTo(leafletMap);
if(!b) b=poly.getBounds(); else b.extend(poly.getBounds());
});
if(b){leafletMap.fitBounds(b,{padding:[20,20]});has=true;}
}
}catch(e){}
}
if(!has){leafletMap.setView([39.5,-98.35],5);}
setTimeout(()=>{if(leafletMap) leafletMap.invalidateSize();},300);
}
