<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breaking Weather — 170 Radars + Full Alerts</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8107327731283027" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;padding:12px;padding-bottom:90px}
h1{font-size:16px;font-weight:900;background:linear-gradient(90deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
#search{width:100%;padding:14px;border-radius:16px;border:2px solid #d4af37;background:#111;color:#FFD700;margin:10px 0;position:sticky;top:8px;z-index:30}
.tabs{display:flex;gap:8px;margin:10px 0}.tab{flex:1;padding:12px;border-radius:999px;border:2px solid #3a3000;background:#111;color:#9a8a4a;font-weight:800;text-align:center;cursor:pointer}.tab.active{background:#FFD700;color:#000;border-color:#FFD700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border:2px solid #3a3000;border-radius:16px;background:#111;padding:10px;min-height:200px}
.badge{background:#FFD700;color:#000;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}
.city{font-weight:800;color:#FFEC8B;font-size:11px;margin-top:4px}
.radar-img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-top:6px;background:#000;cursor:pointer}
.enlarge-btn{color:#FFD700;font-weight:800;cursor:pointer;padding:9px 0;font-size:11px;text-align:center;background:#000;border:1px solid #3a3000;border-radius:8px;margin-top:6px}
.share-btn{width:100%;padding:9px;border-radius:999px;border:2px solid #d4af37;background:#000;color:#FFD700;font-weight:800;font-size:10px;cursor:pointer;margin-top:6px}
.ad-inline{grid-column:1/-1;background:#111;border:1px dashed #333;border-radius:12px;padding:8px;text-align:center;min-height:70px}
.sticky-ad{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #FFD700;min-height:70px;text-align:center;z-index:1000;padding:4px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #222}
.switch{width:48px;height:28px;background:#333;border-radius:999px;position:relative;cursor:pointer}.switch.on{background:#2196F3}.switch:after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}.switch.on:after{left:23px}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;flex-direction:column;overflow:hidden}#modal.show{display:flex!important}
.modal-ad{width:100%;height:70px;min-height:70px;background:#111;border-top:1px solid #d4af37;border-bottom:1px solid #d4af37;text-align:center;padding:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.modal-center{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:10px;overflow:auto;background:#000}
#modal-img{max-width:95vw;max-height:45vh;width:auto;height:auto;border-radius:16px;border:3px solid #FFD700;object-fit:contain;display:block;margin:0 auto}
select{padding:8px;border-radius:8px;background:#111;color:#FFD700;border:2px solid #3a3000;width:100%;margin:6px 0}
</style></head><body>
<h1>👑 Breaking Weather — 170 Radars + Full Alerts</h1>
<input id="search" placeholder="Search Texas, Missouri, KTLX, Tornado...">
<div class="tabs"><div class="tab active" id="tab-radars" onclick="showTab('radars')">🛰️ 170 Radars (<span id="radar-count">0</span>)</div><div class="tab" id="tab-warnings" onclick="showTab('warnings')">🚨 ALL Warnings (<span id="warning-count">0</span>)</div></div>
<div class="grid" id="radar-grid"></div>
<div id="warnings-panel" style="display:none"></div>

<div id="modal">
<div class="modal-ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8107327731283027" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
<div class="modal-center"><img id="modal-img"><div id="modal-title" style="color:#FFD700;font-weight:900;margin-top:10px;text-align:center;font-size:13px"></div><div id="modal-desc" style="color:#ccc;font-size:11px;margin-top:10px;white-space:pre-wrap;text-align:left;max-width:95vw;line-height:1.4"></div><button onclick="closeModal()" style="margin-top:14px;background:#FFD700;color:#000;padding:11px 26px;border-radius:999px;font-weight:900">✕ CLOSE</button></div>
<div class="modal-ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8107327731283027" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
</div>

<div class="sticky-ad"><button onclick="this.parentElement.style.display='none'" style="position:absolute;top:2px;right:8px;background:#FFD700;color:#000;border:none;border-radius:50%;width:20px;height:20px">✕</button><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8107327731283027" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<script>
const SHARE_SITE='https://worldbreakingweather.github.io';
const RADARS=["KABR","KABX","KAKQ","KAMA","KAMX","KAPX","KARX","KATX","KBBX","KBGM","KBIS","KBLX","KBMX","KBOX","KBRO","KBUF","KBYX","KCAE","KCBW","KCBX","KCCX","KCLE","KCLX","KCRP","KCXX","KCYS","KDAX","KDDC","KDFX","KDGX","KDMX","KDOX","KDTX","KDVN","KDYX","KEAX","KEMX","KENX","KEOX","KEPZ","KESX","KEVX","KEWX","KEYX","KFCX","KFDR","KFDX","KFFC","KFSD","KFSX","KFTG","KFWX","KGGW","KGJX","KGLD","KGRB","KGRK","KGRR","KGWX","KGYX","KHDC","KHDX","KHGX","KHNX","KHPX","KHTX","KICT","KICX","KILN","KILX","KIND","KINX","KIWA","KIWX","KJAN","KJAX","KJGX","KJKL","KLBB","KLCH","KLIX","KLNX","KLOT","KLRX","KLSX","KLTX","KLVX","KLWX","KLZK","KMAF","KMAX","KMBX","KMHX","KMKX","KMLB","KMLX","KMMX","KMPX","KMQT","KMRX","KMSX","KMTX","KMUX","KMVX","KMXX","KNKX","KNQA","KOAX","KOHX","KOKX","KOTX","KPAH","KPBZ","KPDT","KPOE","KPUX","KRAX","KRGX","KRIW","KRLX","KRTX","KSFX","KSJT","KSOX","KSRX","KTBW","KTFX","KTWX","KTYX","KUDX","KUEX","KVAX","KVBX","KVNX","KVTX","KVWX","KYUX","PABC","PAHG","PAIH","PAKC","PAPD","PHKI","PHKM","PHMO","PHWA","PGUA","TJUA","KFWS","KTLX"];
const RADAR_STATES={"KABR":"South Dakota SD","KABX":"New Mexico NM","KAKQ":"Virginia VA","KAMA":"Texas TX Amarillo TX","KAMX":"Florida FL","KAPX":"Michigan MI","KARX":"Wisconsin WI","KATX":"Washington WA","KBBX":"California CA","KBGM":"New York NY","KBIS":"North Dakota ND","KBLX":"Montana MT","KBMX":"Alabama AL","KBOX":"Massachusetts MA","KBRO":"Texas TX Brownsville TX","KBUF":"New York NY","KBYX":"Florida FL","KCAE":"South Carolina SC","KCBW":"Maine ME","KCBX":"Idaho ID","KCCX":"Pennsylvania PA","KCLE":"Ohio OH","KCLX":"South Carolina SC","KCRP":"Texas TX Corpus Christi TX","KCXX":"Vermont VT","KCYS":"Wyoming WY","KDAX":"California CA","KDDC":"Kansas KS","KDFX":"Texas TX Del Rio TX","KDGX":"Mississippi MS","KDMX":"Iowa IA","KDOX":"Delaware DE","KDTX":"Michigan MI","KDVN":"Iowa IA","KDYX":"Texas TX Dyess TX","KEAX":"Missouri MO Kansas City MO","KEMX":"Arizona AZ","KENX":"New York NY","KEOX":"Alabama AL","KEPZ":"Texas TX El Paso TX","KESX":"Wisconsin WI","KEVX":"Florida FL","KEWX":"Texas TX San Antonio TX","KEYX":"California CA","KFCX":"Virginia VA","KFDR":"Oklahoma OK","KFDX":"New Mexico NM","KFFC":"Georgia GA","KFSD":"South Dakota SD","KFSX":"Arizona AZ","KFTG":"Colorado CO","KFWX":"California CA","KGGW":"Montana MT","KGJX":"Colorado CO","KGLD":"Kansas KS","KGRB":"Wisconsin WI","KGRK":"Texas TX Fort Hood TX","KGRR":"Michigan MI","KGWX":"Mississippi MS","KGYX":"Maine ME","KHDC":"Louisiana LA","KHDX":"New Mexico NM","KHGX":"Texas TX Houston TX Galveston TX","KHNX":"California CA","KHPX":"Kentucky KY","KHTX":"Alabama AL","KICT":"Kansas KS","KICX":"Utah UT","KILN":"Ohio OH","KILX":"Illinois IL","KIND":"Indiana IN","KINX":"Oklahoma OK","KIWA":"Arizona AZ","KIWX":"Indiana IN","KJAN":"Mississippi MS","KJAX":"Florida FL","KJGX":"Georgia GA","KJKL":"Kentucky KY","KLBB":"Texas TX Lubbock TX","KLCH":"Louisiana LA","KLIX":"Louisiana LA","KLNX":"Nebraska NE","KLOT":"Illinois IL","KLRX":"Nevada NV","KLSX":"Missouri MO St Louis MO","KLTX":"North Carolina NC","KLVX":"Kentucky KY","KLWX":"Virginia VA","KLZK":"Arkansas AR","KMAF":"Texas TX Midland TX","KMAX":"Minnesota MN","KMBX":"North Dakota ND","KMHX":"North Carolina NC","KMKX":"Wisconsin WI","KMLB":"Florida FL","KMLX":"California CA","KMMX":"Minnesota MN","KMPX":"Minnesota MN","KMQT":"Michigan MI","KMRX":"Tennessee TN","KMSX":"Montana MT","KMTX":"Montana MT","KMUX":"California CA","KMVX":"North Dakota ND","KMXX":"Alabama AL","KNKX":"California CA","KNQA":"Tennessee TN","KOAX":"Nebraska NE","KOHX":"Tennessee TN","KOKX":"New York NY","KOTX":"Washington WA","KPAH":"Kentucky KY","KPBZ":"Pennsylvania PA","KPDT":"Oregon OR","KPOE":"Louisiana LA","KPUX":"Colorado CO","KRAX":"North Carolina NC","KRGX":"Nevada NV","KRIW":"Wyoming WY","KRLX":"West Virginia WV","KRTX":"Oregon OR","KSFX":"Idaho ID","KSJT":"Texas TX San Angelo TX","KSOX":"California CA","KSRX":"Arkansas AR","KTBW":"Florida FL","KTFX":"Montana MT","KTWX":"Kansas KS","KTYX":"New York NY","KUDX":"South Dakota SD","KUEX":"Nebraska NE","KVAX":"Georgia GA","KVBX":"California CA","KVNX":"Oklahoma OK","KVTX":"California CA","KVWX":"Indiana IN","KYUX":"Arizona AZ","PABC":"Alaska AK","PAHG":"Alaska AK","PAIH":"Alaska AK","PAKC":"Alaska AK","PAPD":"Alaska AK","PHKI":"Hawaii HI","PHKM":"Hawaii HI","PHMO":"Hawaii HI","PHWA":"Hawaii HI","PGUA":"Guam GU","TJUA":"Puerto Rico PR","KFWS":"Texas TX Fort Worth TX","KTLX":"Oklahoma OK Oklahoma City OK"};

let allAlerts=[];
function buildRadarGrid(){
const grid=document.getElementById('radar-grid');grid.innerHTML='';
[...new Set(RADARS)].forEach((id,i)=>{
if(i>0&&i%4===0){const ad=document.createElement('div');ad.className='ad-inline';ad.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8107327731283027" data-ad-format="auto" data-full-width-responsive="true"></ins>';grid.appendChild(ad);try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
const s=RADAR_STATES[id]||id;const t=(id+' '+s).toLowerCase();
const card=document.createElement('div');card.className='card';card.setAttribute('data-search',t);
card.innerHTML=`<div style="display:flex;justify-content:space-between"><strong>${id}</strong><span class="badge">LIVE</span></div><div class="city">${s}</div><img class="radar-img" loading="lazy" src="https://radar.weather.gov/ridge/standard/${id}_loop.gif"><div class="enlarge-btn" onclick="openRadar('${id}')">TAP TO ENLARGE — FULL RADAR</div><button class="share-btn" onclick="shareRadar('${id}')">📤 SHARE ${id}</button>`;
const img=card.querySelector('.radar-img');img.addEventListener('click',()=>openRadar(id));img.addEventListener('error',()=>{card.style.display='none';updateRadarCount();});img.addEventListener('load',updateRadarCount);
grid.appendChild(card);
});
updateRadarCount(); fetchWarnings();
}
function updateRadarCount(){let c=0;document.querySelectorAll('#radar-grid.card').forEach(x=>{if(x.style.display!=='none') c++;});document.getElementById('radar-count').innerText=c;}
async function fetchWarnings(){
try{const r=await fetch('https://api.weather.gov/alerts/active');const d=await r.json();allAlerts=d.features||[];document.getElementById('warning-count').innerText=allAlerts.length;renderWarnings(allAlerts);}catch(e){document.getElementById('warning-count').innerText='0';}
}
function renderWarnings(list){
const panel=document.getElementById('warnings-panel');panel.innerHTML='';
const cats={
General:['911/Other','Shelter In Place Warning','Evacuation Immediate','Civil Danger Warning','Civil Emergency Message','Law Enforcement Warning','Local Area Emergency','911 Telephone Outage'],
Severe:['Tornado Warning','Severe Thunderstorm Warning','Flash Flood Warning','Special Marine Warning','Tornado Watch','Severe Thunderstorm Watch','Flash Flood Watch','Special Weather Statement','Marine Weather Statement'],
Winter:['Blizzard Warning','Snow Squall Warning','Ice Storm Warning','Winter Storm Warning','Lake Effect Snow Warning','Avalanche Warning','Extreme Cold Warning','Freeze Warning','Winter Storm Watch','Avalanche Watch','Extreme Cold Watch','Freeze Watch','Winter Weather Advisory','Cold Weather Advisory','Frost Advisory'],
Hydro:['Tsunami Warning','Flood (forecast point) Warning','Flood Warning','Coastal Flood Warning','Lakeshore Flood Warning','High Surf Warning','Tsunami Watch','Flood (forecast point) Watch','Flood Watch','Coastal Flood Watch','Lakeshore Flood Watch','Tsunami Advisory','Flood (forecast point) Advisory','Flood Advisory','Coastal Flood Advisory','Lakeshore Flood Advisory','High Surf Advisory','Rip Current Statement','Beach Hazards Statement','Coastal Flood Statement','Hydrologic Outlook'],
WindAir:['Extreme Wind Warning','Hurricane Force Wind Warning','Dust Storm Warning','Blowing Dust Warning','High Wind Warning','Hurricane Force Wind Watch','High Wind Watch','Dense Fog Advisory','Dense Fog (marine) Advisory','Dense Smoke Advisory','Dust Advisory','Blowing Dust Advisory','Lake Wind Advisory','Wind Advisory','Freezing Fog Advisory','Air Stagnation Advisory','Air Quality Alert']
};
let html='<select id="catSelect" onchange="filterCat(this.value)"><option value="All">All Categories</option><option value="General">General</option><option value="Severe">Severe</option><option value="Winter">Winter</option><option value="Hydro">Hydro</option><option value="WindAir">Wind/Air</option></select>';
html+='<div style="max-height:300px;overflow:auto;border:1px solid #222;border-radius:12px;margin-bottom:10px">';
Object.keys(cats).forEach(cat=>{cats[cat].forEach(name=>{
html+=`<div class="toggle-row" data-cat="${cat}"><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;background:${cat==='Severe'?'#f00':cat==='Winter'?'#0ff':cat==='Hydro'?'#0a0':'#fa0'};border-radius:3px"></div><span style="font-size:12px">${name}</span></div><div class="switch on" data-name="${name.toLowerCase()}" onclick="this.classList.toggle('on');applyFilters()"></div></div>`;
});});
html+='</div><div class="grid" id="warn-grid">';
list.slice(0,120).forEach((f,i)=>{
const p=f.properties;const idShort=p.id.split('/').pop();
const mapUrl=`https://api.weather.gov/alerts/${idShort}/map`;
html+=`<div class="card warn-card" data-event="${(p.event||'').toLowerCase()}"><strong style="color:#FFD700;font-size:12px">${p.event||'Test Message'}</strong><div class="city">${p.areaDesc||''}</div><div style="font-size:10px;color:#ccc;margin-top:4px;height:32px;overflow:hidden">${p.headline||''}</div><img class="radar-img" src="${mapUrl}" alt="Polygon Map" onerror="this.style.display='none'" style="height:110px"><div class="enlarge-btn" onclick="openWarning(${i})">TAP TO ENLARGE — POLYGON + FULL MESSAGE</div><button class="share-btn" onclick="shareWarning(${i})">📤 SHARE WARNING</button></div>`;
if((i+1)%4===0) html+=`<div class="ad-inline"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8107327731283027" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;
});
html+='</div>';panel.innerHTML=html;try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
}
function applyFilters(){
const active=[];document.querySelectorAll('.switch.on').forEach(s=>active.push(s.getAttribute('data-name')));
document.querySelectorAll('.warn-card').forEach(c=>{const ev=c.getAttribute('data-event');let show=active.some(a=>ev.includes(a));c.style.display=show||active.length===0?'':'none';});
}
function filterCat(cat){document.querySelectorAll('.toggle-row').forEach(r=>{r.style.display=cat==='All'||r.getAttribute('data-cat')===cat?'flex':'none';});}
function openRadar(id){
document.getElementById('modal-img').src='https://radar.weather.gov/ridge/standard/'+id+'_loop.gif';
document.getElementById('modal-title').innerText=id+' — '+(RADAR_STATES[id]||id)+' — FULL LOOP';
document.getElementById('modal-desc').innerText='Live NWS loop. Affected polygon shown for warnings only. Share: '+SHARE_SITE+'?radar='+id;
document.getElementById('modal').classList.add('show');try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
}
function openWarning(i){
const f=allAlerts[i];if(!f) return;const p=f.properties;const idShort=p.id.split('/').pop();
document.getElementById('modal-img').src='https://api.weather.gov/alerts/'+idShort+'/map';
document.getElementById('modal-title').innerText=(p.event||'')+' — '+(p.areaDesc||'');
document.getElementById('modal-desc').innerText=(p.headline||'')+'\n\n'+(p.description||'')+'\n\nINSTRUCTION:\n'+(p.instruction||'')+'\n\nISSUED: '+p.sent+'\nEXPIRES: '+p.expires+'\n\nPOLYGON MAP ABOVE SHOWS AFFECTED AREA.';
document.getElementById('modal').classList.add('show');try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function shareRadar(id){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(SHARE_SITE+'?radar='+id),'_blank');}
function shareWarning(i){const p=allAlerts[i].properties;window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(SHARE_SITE+'?warn='+p.id)+'&quote='+encodeURIComponent(p.event+' — '+p.headline),'_blank');}
function showTab(which){
document.getElementById('tab-radars').classList.toggle('active',which==='radars');
document.getElementById('tab-warnings').classList.toggle('active',which==='warnings');
document.getElementById('radar-grid').style.display=which==='radars'?'grid':'none';
document.getElementById('warnings-panel').style.display=which==='warnings'?'block':'none';
document.getElementById('search').placeholder=which==='radars'?'Search Texas, KTLX...':'Search Tornado, Flood...';
}
const inp=document.getElementById('search');
inp.addEventListener('input',()=>{
const q=inp.value.toLowerCase().trim();
const cards=document.querySelectorAll('#radar-grid.card');
let vis=0;cards.forEach(c=>{const s=(c.getAttribute('data-search')||'').toLowerCase();const show=q===''||s.includes(q);c.style.display=show?'':'none';if(show) vis++;});
document.getElementById('radar-count').innerText=vis;
document.querySelectorAll('#radar-grid.ad-inline').forEach(ad=>ad.style.display=q===''?'':'none');
const wcards=document.querySelectorAll('.warn-card');wcards.forEach(c=>{const s=c.getAttribute('data-event')||'';c.style.display=q===''||s.includes(q)?'':'none';});
});
window.addEventListener('DOMContentLoaded',buildRadarGrid);
</script></body></html>
