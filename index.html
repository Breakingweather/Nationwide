<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breaking Weather — Live Radar + Warning Polygons</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8107327731283027" crossorigin="anonymous"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:12px;padding-bottom:88px}
h1{font-size:17px;font-weight:900;text-align:center;color:#FFD700;margin:3px 0 10px}
#search{width:100%;padding:13px 14px;border-radius:16px;border:2px solid #d4af37;background:#111;color:#FFD700;outline:none;margin-bottom:10px;position:sticky;top:8px;z-index:30}
.tabs{display:flex;gap:8px;margin:8px 0 10px}
.tab{flex:1;padding:11px;border-radius:999px;border:2px solid #3a3000;background:#111;color:#9a8a4a;font-weight:900;text-align:center;cursor:pointer}
.tab.active{background:#FFD700;color:#000;border-color:#FFD700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.card{border:2px solid #3a3000;border-radius:16px;background:#111;padding:10px;min-height:180px}
.card strong{font-size:13px}
.badge{background:#FFD700;color:#000;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900}
.city{font-weight:800;color:#FFEC8B;font-size:11px;margin-top:4px}
.radar-img{width:100%;height:145px;object-fit:cover;border-radius:12px;margin-top:7px;background:#000;cursor:pointer}
.enlarge-btn,.share-btn{width:100%;padding:9px;border-radius:9px;border:1px solid #3a3000;background:#000;color:#FFD700;font-weight:900;font-size:10px;cursor:pointer;margin-top:6px}
.share-btn{border:2px solid #d4af37;border-radius:999px}
.ad-inline{grid-column:1/-1;background:#111;border:1px dashed #333;border-radius:12px;padding:8px;text-align:center;min-height:70px}
.sticky-ad{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #FFD700;min-height:70px;text-align:center;z-index:1000;padding:4px}
#warnings-panel{display:none}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.controls button,.controls select{background:#111;color:#FFD700;border:1px solid #665000;border-radius:9px;padding:8px;font-weight:800}
#status{font-size:10px;color:#aaa;margin:5px 2px 9px}
#modal{display:none;position:fixed;inset:0;background:#000;z-index:99999;flex-direction:column}
#modal.show{display:flex}
.modal-head{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #444}
.modal-head strong{color:#FFD700;font-size:12px;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-close{background:#FFD700;color:#000;border:0;border-radius:999px;padding:8px 14px;font-weight:900}
#warningMap{height:46vh;min-height:280px;width:100%;background:#111}
.modal-tools{display:flex;gap:6px;flex-wrap:wrap;padding:7px 9px;border-bottom:1px solid #222}
.modal-tools button{background:#111;color:#FFD700;border:1px solid #665000;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:900}
.modal-tools button.on{background:#FFD700;color:#000}
.warning-text{overflow:auto;padding:10px;flex:1}
.warning-title{color:#FFD700;font-weight:900;font-size:14px}
.meta{font-size:10px;color:#bbb;margin-top:5px;line-height:1.5}
.warning-body{white-space:pre-wrap;color:#ddd;font-size:11px;line-height:1.45;margin-top:10px}
.legend-note{font-size:9px;color:#aaa;margin-top:6px}
.leaflet-control-layers{font-size:11px}
.direction-arrow{font-weight:900;color:#111}
</style>
</head>

<body>

<h1>👑 Breaking Weather — Live Radar + Full Alerts</h1>

<input id="search" placeholder="Search Texas, Harris County, KTLX, Tornado, Flood...">

<div class="tabs">
  <div class="tab active" id="tab-radars" onclick="showTab('radars')">
    🛰️ RADARS <span id="radar-count">0</span>
  </div>

  <div class="tab" id="tab-warnings" onclick="showTab('warnings')">
    🚨 WARNINGS <span id="warning-count">0</span>
  </div>
</div>

<div id="status">Starting weather data…</div>

<div class="grid" id="radar-grid"></div>

<div id="warnings-panel"></div>


<!-- FULL WARNING MAP MODAL -->

<div id="modal">

  <div class="modal-head">

    <strong id="modal-title">
      Warning Map
    </strong>

    <button class="modal-close" onclick="closeModal()">
      ✕ CLOSE
    </button>

  </div>


  <div id="warningMap"></div>


  <div class="modal-tools">

    <button id="radarBtn"
            class="on"
            onclick="toggleLayer('radar')">
      🌧️ RADAR
    </button>

    <button id="lightningBtn"
            onclick="toggleLayer('lightning')">
      ⚡ LIGHTNING
    </button>

    <button id="motionBtn"
            class="on"
            onclick="toggleLayer('motion')">
      ➡️ MOTION
    </button>

    <button onclick="fitWarning()">
      🎯 FIT WARNING
    </button>

  </div>


  <div class="warning-text">

    <div id="modal-warning-title"
         class="warning-title">
    </div>

    <div id="modal-meta"
         class="meta">
    </div>

    <div id="modal-body"
         class="warning-body">
    </div>

    <div id="polygon-note"
         class="legend-note">
    </div>

  </div>

</div>


<!-- STICKY AD -->

<div class="sticky-ad">

  <button
    onclick="this.parentElement.style.display='none'"
    style="position:absolute;top:2px;right:8px;background:#FFD700;color:#000;border:none;border-radius:50%;width:20px;height:20px">
    ✕
  </button>

  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-8107327731283027"
       data-ad-format="auto"
       data-full-width-responsive="true">
  </ins>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const SHARE_SITE =
  'https://worldbreakingweather.github.io';

const NWS =
  'https://api.weather.gov';

const USER_AGENT =
  'WorldBreakingWeather/2.0 (weather dashboard)';


/* =========================================================
   RADAR LIST
========================================================= */

const RADARS = [

"KABR","KABX","KAKQ","KAMA","KAMX","KAPX","KARX",
"KATX","KBBX","KBGM","KBIS","KBLX","KBMX","KBOX",
"KBRO","KBUF","KBYX","KCAE","KCBW","KCBX","KCCX",
"KCLE","KCLX","KCRP","KCXX","KCYS","KDAX","KDDC",
"KDFX","KDGX","KDMX","KDOX","KDTX","KDVN","KDYX",
"KEAX","KEMX","KENX","KEOX","KEPZ","KESX","KEVX",
"KEWX","KEYX","KFCX","KFDR","KFDX","KFFC","KFSD",
"KFSX","KFTG","KFWX","KGGW","KGJX","KGLD","KGRB",
"KGRK","KGRR","KGWX","KGYX","KHDC","KHDX","KHGX",
"KHNX","KHPX","KHTX","KICT","KICX","KILN","KILX",
"KIND","KINX","KIWA","KIWX","KJAN","KJAX","KJGX",
"KJKL","KLBB","KLCH","KLIX","KLNX","KLOT","KLRX",
"KLSX","KLTX","KLVX","KLWX","KLZK","KMAF","KMAX",
"KMBX","KMHX","KMKX","KMLB","KMLX","KMMX","KMPX",
"KMQT","KMRX","KMSX","KMTX","KMUX","KMVX","KMXX",
"KNKX","KNQA","KOAX","KOHX","KOKX","KOTX","KPAH",
"KPBZ","KPDT","KPOE","KPUX","KRAX","KRGX","KRIW",
"KRLX","KRTX","KSFX","KSJT","KSOX","KSRX","KTBW",
"KTFX","KTWX","KTYX","KUDX","KUEX","KVAX","KVBX",
"KVNX","KVTX","KVWX","KYUX","PABC","PAHG","PAIH",
"PAKC","PAPD","PHKI","PHKM","PHMO","PHWA","PGUA",
"TJUA","KFWS","KTLX"

];


/* =========================================================
   RADAR NAMES
========================================================= */

const RADAR_NAMES = {

"KHGX":"Houston / Galveston, TX",
"KTLX":"Oklahoma City, OK",
"KDFX":"Del Rio, TX",
"KFWS":"Fort Worth, TX",
"KAMA":"Amarillo, TX",
"KMAF":"Midland, TX",
"KLCH":"Lake Charles, LA",
"KLIX":"New Orleans, LA",
"KJAN":"Jackson, MS",
"KDGX":"Jackson, MS",
"KGRB":"Green Bay, WI",
"KARX":"La Crosse, WI",
"KMKX":"Milwaukee, WI",
"KLOT":"Chicago, IL",
"KDMX":"Des Moines, IA",
"KDVN":"Davenport, IA",
"KOAX":"Omaha, NE",
"KEAX":"Kansas City, MO",
"KLSX":"St. Louis, MO",
"KOUN":"Norman, OK",
"KINX":"Tulsa, OK"

};


/* =========================================================
   APPLICATION STATE
========================================================= */

let allAlerts = [];

let map = null;

let currentAlert = null;

let warningLayer = null;

let radarLayer = null;

let lightningLayer = null;

let motionLayer = null;

let radarOn = true;

let lightningOn = false;

let motionOn = true;

let radarTimer = null;


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(/[&<>"']/g, function(match){

      return {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[match];

    });

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message){

  document.getElementById('status').innerText =
    message;

}


/* =========================================================
   NWS FETCH
========================================================= */

function nwsFetch(url){

  return fetch(url, {

    headers: {

      'Accept':
        'application/geo+json, application/json',

      'User-Agent':
        USER_AGENT

    }

  })

  .then(function(response){

    if(!response.ok){

      throw new Error(
        'HTTP ' + response.status
      );

    }

    return response.json();

  });

}


/* =========================================================
   RADAR IMAGE URL
========================================================= */

function radarUrl(id){

  return

    `https://radar.weather.gov/ridge/standard/${id}_loop.gif`;

}


/* =========================================================
   BUILD RADAR GRID
========================================================= */

function buildRadarGrid(){

  const grid =
    document.getElementById('radar-grid');

  grid.innerHTML = '';

  const ids =
    [...new Set(RADARS)];


  ids.forEach(function(id,index){

    if(index > 0 && index % 4 === 0){

      const ad =
        document.createElement('div');

      ad.className =
        'ad-inline';

      ad.innerHTML =
        '<ins class="adsbygoogle" ' +
        'style="display:block" ' +
        'data-ad-client="ca-pub-8107327731283027" ' +
        'data-ad-format="auto" ' +
        'data-full-width-responsive="true"></ins>';

      grid.appendChild(ad);

      try{

        (adsbygoogle =
          window.adsbygoogle || [])
          .push({});

      }catch(error){}

    }


    const label =
      RADAR_NAMES[id] || id;


    const card =
      document.createElement('div');

    card.className =
      'card radar-card';

    card.dataset.search =
      (id + ' ' + label).toLowerCase();


    card.innerHTML = `

      <div style="display:flex;justify-content:space-between">

        <strong>
          ${esc(id)}
        </strong>

        <span class="badge">
          LIVE
        </span>

      </div>

      <div class="city">
        ${esc(label)}
      </div>

      <img
        class="radar-img"
        loading="lazy"
        src="${radarUrl(id)}"
        alt="${esc(id)} radar">

      <button
        class="enlarge-btn"
        onclick="openRadar('${id}')">

        TAP TO ENLARGE — FULL RADAR

      </button>

      <button
        class="share-btn"
        onclick="shareRadar('${id}')">

        📤 SHARE ${esc(id)}

      </button>

    `;


    const img =
      card.querySelector('img');


    img.addEventListener(
      'error',
      function(){

        card.dataset.dead = '1';

        card.style.display = 'none';

        updateRadarCount();

      }
    );


    grid.appendChild(card);

  });


  updateRadarCount();

}


/* =========================================================
   RADAR COUNT
========================================================= */

function updateRadarCount(){

  const cards =
    [...document.querySelectorAll(
      '#radar-grid .radar-card'
    )];


  const visible =
    cards.filter(function(card){

      return card.style.display !== 'none';

    }).length;


  document.getElementById(
    'radar-count'
  ).innerText = visible;

}


/* =========================================================
   OPEN RADAR
========================================================= */

function openRadar(id){

  window.open(

    radarUrl(id),

    '_blank',

    'noopener'

  );

}


/* =========================================================
   FETCH ACTIVE WARNINGS
========================================================= */

async function fetchWarnings(){

  try{

    setStatus(
      'Loading active NWS alerts…'
    );


    const data =
      await nwsFetch(
        NWS + '/alerts/active'
      );


    allAlerts =
      data.features || [];


    document.getElementById(
      'warning-count'
    ).innerText =
      allAlerts.length;


    renderWarnings(
      allAlerts
    );


    setStatus(

      `NWS active alerts: ${allAlerts.length}` +
      ` • Updated ${new Date().toLocaleTimeString()}`

    );


  }catch(error){

    console.error(error);


    setStatus(

      'Unable to load NWS alerts right now. ' +
      'The NWS API may be rate-limiting or temporarily unavailable.'

    );

  }

}


/* =========================================================
   WARNING TYPE
========================================================= */

function severityClass(properties){

  const event =
    (properties.event || '')
      .toLowerCase();


  if(event.includes('tornado')){

    return 'TORNADO';

  }


  if(event.includes(
    'severe thunderstorm'
  )){

    return 'SEVERE';

  }


  if(event.includes(
    'flash flood'
  )){

    return 'FLOOD';

  }


  return 'OTHER';

}


/* =========================================================
   RENDER WARNINGS
========================================================= */

function renderWarnings(list){

  const panel =
    document.getElementById(
      'warnings-panel'
    );


  panel.innerHTML = `

    <div class="controls">

      <select
        id="warnType"
        onchange="filterWarnings()">

        <option value="ALL">
          All alerts
        </option>

        <option value="TORNADO">
          Tornado
        </option>

        <option value="SEVERE">
          Severe Thunderstorm
        </option>

        <option value="FLOOD">
          Flash Flood
        </option>

        <option value="OTHER">
          Other
        </option>

      </select>


      <button onclick="fetchWarnings()">
        🔄 Refresh
      </button>

    </div>


    <div
      class="grid"
      id="warn-grid">
    </div>

  `;


  const grid =
    document.getElementById(
      'warn-grid'
    );


  list.forEach(function(feature,index){

    const properties =
      feature.properties || {};


    const card =
      document.createElement('div');


    card.className =
      'card warn-card';


    card.dataset.event =
      (properties.event || '')
        .toLowerCase();


    card.dataset.search =
      (

        (properties.event || '') +
        ' ' +
        (properties.areaDesc || '') +
        ' ' +
        (properties.headline || '')

      ).toLowerCase();


    card.dataset.type =
      severityClass(
        properties
      );


    const hasGeometry =
      !!feature.geometry;


    card.innerHTML = `

      <div
        style="display:flex;justify-content:space-between;gap:5px">

        <strong style="color:#FFD700">

          ${esc(
            properties.event ||
            'Weather Alert'
          )}

        </strong>


        <span class="badge">

          ${hasGeometry
            ? 'POLYGON'
            : 'AREA'}

        </span>

      </div>


      <div class="city">

        ${esc(
          properties.areaDesc ||
          'Affected area unavailable'
        )}

      </div>


      <div
        style="font-size:10px;color:#ccc;margin-top:5px;height:35px;overflow:hidden">

        ${esc(
          properties.headline || ''
        )}

      </div>


      <button
        class="enlarge-btn"
        onclick="openWarning(${index})">

        🗺️ OPEN RADAR + AFFECTED AREA

      </button>


      <button
        class="share-btn"
        onclick="shareWarning(${index})">

        📤 SHARE WARNING

      </button>

    `;


    grid.appendChild(card);


    if((index + 1) % 8 === 0){

      const ad =
        document.createElement('div');

      ad.className =
        'ad-inline';

      ad.innerHTML =
        '<ins class="adsbygoogle" ' +
        'style="display:block" ' +
        'data-ad-client="ca-pub-8107327731283027" ' +
        'data-ad-format="auto" ' +
        'data-full-width-responsive="true"></ins>';

      grid.appendChild(ad);


      try{

        (adsbygoogle =
          window.adsbygoogle || [])
          .push({});

      }catch(error){}

    }

  });

}


/* =========================================================
   WARNING FILTER
========================================================= */

function filterWarnings(){

  const query =
    document.getElementById(
      'search'
    ).value
      .toLowerCase()
      .trim();


  const type =
    document.getElementById(
      'warnType'
    ).value;


  document.querySelectorAll(
    '.warn-card'
  ).forEach(function(card){

    const searchMatch =
      !query ||
      card.dataset.search
        .includes(query);


    const typeMatch =
      type === 'ALL' ||
      card.dataset.type === type;


    card.style.display =
      searchMatch && typeMatch
        ? ''
        : 'none';

  });

}


/* =========================================================
   INITIALIZE LEAFLET MAP
========================================================= */

function initMap(){

  if(map){

    return;

  }


  map =
    L.map(
      'warningMap',
      {
        zoomControl:true,
        preferCanvas:true
      }
    ).setView(
      [37.8,-96],
      4
    );


  L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

      attribution:
        '&copy; OpenStreetMap contributors'

    }

  ).addTo(map);

}


/* =========================================================
   GEOJSON → LEAFLET
========================================================= */

function geometryToLayer(
  geometry
){

  if(!geometry){

    return null;

  }


  return L.geoJSON(

    geometry,

    {

      style: {

        color:'#FFD700',

        weight:4,

        fillColor:'#ff0000',

        fillOpacity:.20

      }

    }

  );

}


/* =========================================================
   GET GEOMETRY BOUNDS
========================================================= */

function geometryBounds(layer){

  try{

    const bounds =
      layer.getBounds();


    if(bounds.isValid()){

      return bounds;

    }

  }catch(error){}


  return null;

}


/* =========================================================
   FALLBACK GEOGRAPHIC AREA
========================================================= */

async function buildFallbackGeometry(
  properties
){

  /*
    When the NWS alert itself has no geometry,
    attempt to retrieve the official NWS
    county or forecast-zone boundary.

    IMPORTANT:
    This is NOT represented as a storm-specific
    NWS warning polygon.
  */


  try{

    const zones =
      (
        properties.geocode?.UGC ||
        []
      ).filter(function(value){

        return /^[A-Z]{2}Z/.test(value);

      });


    if(zones.length){

      const zone =
        await nwsFetch(

          NWS +
          '/zones/forecast/' +
          zones[0]

        );


      if(zone.geometry){

        return {

          geometry:
            zone.geometry,

          kind:
            'NWS forecast-zone boundary'

        };

      }

    }

  }catch(error){

    console.warn(
      'Forecast-zone fallback failed',
      error
    );

  }


  try{

    const counties =
      (
        properties.geocode?.UGC ||
        []
      ).filter(function(value){

        return /^[A-Z]{2}C/.test(value);

      });


    if(counties.length){

      const county =
        await nwsFetch(

          NWS +
          '/zones/county/' +
          counties[0]

        );


      if(county.geometry){

        return {

          geometry:
            county.geometry,

          kind:
            'NWS county boundary'

        };

      }

    }

  }catch(error){

    console.warn(
      'County fallback failed',
      error
    );

  }


  return null;

}


/* =========================================================
   RADAR OVERLAY
========================================================= */

function addRadarOverlay(){

  if(!map){

    return;

  }


  if(radarLayer){

    return;

  }


  /*
    Public NOAA/NWS radar WMS.

    This is used as the precipitation
    backdrop for the interactive warning map.
  */


  try{

    radarLayer =
      L.tileLayer.wms(

        'https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows',

        {

          layers:
            'conus_bref_qcd',

          format:
            'image/png',

          transparent:
            true,

          opacity:
            .58,

          attribution:
            'NWS radar / NOAA'

        }

      );


    radarLayer.addTo(map);


  }catch(error){

    console.warn(
      'Radar WMS unavailable',
      error
    );

  }

}


/* =========================================================
   TOGGLE MAP LAYERS
========================================================= */

function toggleLayer(which){

  if(!map){

    return;

  }


  /* RADAR */

  if(which === 'radar'){

    radarOn =
      !radarOn;


    if(radarOn){

      if(radarLayer){

        radarLayer.addTo(map);

      }else{

        addRadarOverlay();

      }

    }else{

      if(radarLayer){

        map.removeLayer(
          radarLayer
        );

      }

    }


    document
      .getElementById('radarBtn')
      .classList
      .toggle(
        'on',
        radarOn
      );

  }


  /* LIGHTNING */

  if(which === 'lightning'){

    lightningOn =
      !lightningOn;


    if(lightningLayer){

      if(lightningOn){

        lightningLayer.addTo(map);

      }else{

        map.removeLayer(
          lightningLayer
        );

      }

    }


    document
      .getElementById('lightningBtn')
      .classList
      .toggle(
        'on',
        lightningOn
      );

  }


  /* MOTION */

  if(which === 'motion'){

    motionOn =
      !motionOn;


    if(motionLayer){

      if(motionOn){

        motionLayer.addTo(map);

      }else{

        map.removeLayer(
          motionLayer
        );

      }

    }


    document
      .getElementById('motionBtn')
      .classList
      .toggle(
        'on',
        motionOn
      );

  }

}


/* =========================================================
   LIGHTNING LAYER
========================================================= */

function buildLightningLayer(){

  /*
    IMPORTANT:

    The NWS alert API does not itself provide
    live lightning-strike points.

    Therefore this code does NOT fabricate
    lightning strikes.

    The layer is intentionally prepared so a
    legitimate lightning-data provider can be
    connected later.
  */


  return L.layerGroup();

}


/* =========================================================
   PARSE STORM MOTION
========================================================= */

function parseMotion(text){

  const cleaned =
    (text || '')
      .replace(
        /\s+/g,
        ' '
      );


  let match =
    cleaned.match(

      /moving\s+([A-Z]{1,3})\s+at\s+(\d+)\s*mph/i

    );


  if(!match){

    match =
      cleaned.match(

        /moving\s+([A-Z]{1,3})\s+around\s+(\d+)\s*mph/i

      );

  }


  if(!match){

    return null;

  }


  return {

    dir:
      match[1].toUpperCase(),

    mph:
      Number(match[2])

  };

}


/* =========================================================
   DIRECTION → DEGREES
========================================================= */

const DIR_DEG = {

  N:0,

  NNE:22.5,

  NE:45,

  ENE:67.5,

  E:90,

  ESE:112.5,

  SE:135,

  SSE:157.5,

  S:180,

  SSW:202.5,

  SW:225,

  WSW:247.5,

  W:270,

  WNW:292.5,

  NW:315,

  NNW:337.5

};


/* =========================================================
   CREATE MOTION ARROW
========================================================= */

function addMotionArrow(
  bounds,
  properties
){

  const motion =
    parseMotion(

      (properties.description || '') +
      ' ' +
      (properties.headline || '')

    );


  if(
    !motion ||
    !bounds ||
    !bounds.isValid()
  ){

    return null;

  }


  const center =
    bounds.getCenter();


  const degrees =
    DIR_DEG[motion.dir];


  if(degrees === undefined){

    return null;

  }


  const latitudeDelta =
    (
      bounds.getNorth() -
      bounds.getSouth()
    ) * .30 || .5;


  const longitudeDelta =
    (
      bounds.getEast() -
      bounds.getWest()
    ) * .30 || .5;


  const radians =
    degrees * Math.PI / 180;


  const end = [

    center.lat +
      Math.cos(radians) *
      latitudeDelta,

    center.lng +
      Math.sin(radians) *
      longitudeDelta

  ];


  const line =
    L.polyline(

      [
        center,
        end
      ],

      {

        color:'#00FFFF',

        weight:5,

        opacity:.95

      }

    );


  const arrow =
    L.marker(

      end,

      {

        icon:

          L.divIcon({

            className:'',

            html:

              `<div style="
                font-size:28px;
                color:#00FFFF;
                text-shadow:0 0 4px #000;
                transform:rotate(${degrees}deg)">
                ➤
              </div>`,

            iconSize:
              [30,30],

            iconAnchor:
              [15,15]

          })

      }

    );


  const label =
    L.marker(

      center,

      {

        icon:

          L.divIcon({

            className:'',

            html:

              `<div style="
                background:#000;
                color:#00FFFF;
                border:1px solid #00FFFF;
                border-radius:7px;
                padding:3px 5px;
                font-size:10px;
                font-weight:900;
                white-space:nowrap">

                ${esc(motion.dir)}
                •
                ${motion.mph}
                MPH

              </div>`,

            iconSize:
              [100,24],

            iconAnchor:
              [50,35]

          })

      }

    );


  return L.layerGroup([

    line,

    arrow,

    label

  ]);

}


/* =========================================================
   OPEN WARNING
========================================================= */

async function openWarning(index){

  const feature =
    allAlerts[index];


  if(!feature){

    return;

  }


  currentAlert =
    feature;


  document
    .getElementById('modal')
    .classList
    .add('show');


  initMap();


  setTimeout(function(){

    map.invalidateSize();

  },150);


  if(warningLayer){

    map.removeLayer(
      warningLayer
    );

  }


  if(motionLayer){

    map.removeLayer(
      motionLayer
    );

  }


  if(lightningLayer){

    map.removeLayer(
      lightningLayer
    );

  }


  warningLayer = null;

  motionLayer = null;

  lightningLayer = null;


  const properties =
    feature.properties || {};


  document.getElementById(
    'modal-title'
  ).innerText =
    properties.event ||
    'Weather Alert';


  document.getElementById(
    'modal-warning-title'
  ).innerText =

    (properties.event ||
      'Weather Alert') +

    ' — ' +

    (properties.areaDesc ||
      '');


  document.getElementById(
    'modal-meta'
  ).innerText =

    `ISSUED: ${formatDate(
      properties.sent
    )}

EXPIRES: ${formatDate(
      properties.expires
    )}

SEVERITY: ${
      properties.severity || 'N/A'
    }
 • CERTAINTY: ${
      properties.certainty || 'N/A'
    }
 • URGENCY: ${
      properties.urgency || 'N/A'
    }`;


  document.getElementById(
    'modal-body'
  ).innerText =

    `${properties.headline || ''}

${properties.description || ''}

INSTRUCTIONS:

${properties.instruction ||
  'No specific instructions supplied by NWS.'}`;


  let sourceNote = '';


  /* -----------------------------------------
     OFFICIAL ALERT GEOMETRY
  ----------------------------------------- */

  if(feature.geometry){

    warningLayer =
      geometryToLayer(
        feature.geometry
      );


    sourceNote =
      '🟡 OFFICIAL NWS ALERT GEOMETRY — ' +
      'polygon supplied by the NWS alert feed.';

  }


  /* -----------------------------------------
     FALLBACK GEOMETRY
  ----------------------------------------- */

  else{

    const fallback =
      await buildFallbackGeometry(
        properties
      );


    if(fallback){

      warningLayer =
        geometryToLayer(
          fallback.geometry
        );


      sourceNote =

        `🟠 ${
          fallback.kind.toUpperCase()
        } — no alert polygon was supplied in this alert; ` +

        'the displayed boundary is a geographic fallback, ' +

        'not a storm-specific NWS warning polygon.';

    }else{

      sourceNote =

        '⚠️ NO POLYGON AVAILABLE — this alert did not ' +

        'provide alert geometry and no geographic fallback ' +

        'could be retrieved.';

    }

  }


  /* -----------------------------------------
     ADD WARNING AREA
  ----------------------------------------- */

  if(warningLayer){

    warningLayer.addTo(
      map
    );


    const bounds =
      geometryBounds(
        warningLayer
      );


    if(bounds){

      map.fitBounds(
        bounds.pad(.12)
      );

    }

  }


  /* -----------------------------------------
     ADD RADAR
  ----------------------------------------- */

  addRadarOverlay();


  if(
    radarLayer &&
    !radarOn
  ){

    map.removeLayer(
      radarLayer
    );

  }


  /* -----------------------------------------
     LIGHTNING
  ----------------------------------------- */

  lightningLayer =
    buildLightningLayer();


  if(lightningOn){

    lightningLayer.addTo(
      map
    );

  }


  /* -----------------------------------------
     STORM MOTION
  ----------------------------------------- */

  if(warningLayer){

    const bounds =
      geometryBounds(
        warningLayer
      );


    motionLayer =
      addMotionArrow(
        bounds,
        properties
      );


    if(
      motionLayer &&
      motionOn
    ){

      motionLayer.addTo(
        map
      );

    }

  }


  document.getElementById(
    'polygon-note'
  ).innerText =
    sourceNote;

}


/* =========================================================
   FIT WARNING
========================================================= */

function fitWarning(){

  if(!warningLayer){

    return;

  }


  const bounds =
    geometryBounds(
      warningLayer
    );


  if(bounds){

    map.fitBounds(
      bounds.pad(.12)
    );

  }

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

  if(!value){

    return 'N/A';

  }


  const date =
    new Date(value);


  if(isNaN(date)){

    return value;

  }


  return date.toLocaleString();

}


/* =========================================================
   CLOSE WARNING MAP
========================================================= */

function closeModal(){

  document
    .getElementById('modal')
    .classList
    .remove('show');


  if(radarTimer){

    clearInterval(
      radarTimer
    );

    radarTimer = null;

  }

}


/* =========================================================
   TABS
========================================================= */

function showTab(which){

  document
    .getElementById('tab-radars')
    .classList
    .toggle(
      'active',
      which === 'radars'
    );


  document
    .getElementById('tab-warnings')
    .classList
    .toggle(
      'active',
      which === 'warnings'
    );


  document
    .getElementById('radar-grid')
    .style.display =
      which === 'radars'
        ? 'grid'
        : 'none';


  document
    .getElementById('warnings-panel')
    .style.display =
      which === 'warnings'
        ? 'block'
        : 'none';


  document
    .getElementById('search')
    .placeholder =

      which === 'radars'

        ? 'Search Texas, KTLX, Houston...'

        : 'Search Tornado, Flood, Harris County...';


  applySearch();

}


/* =========================================================
   SEARCH
========================================================= */

function applySearch(){

  const query =
    document
      .getElementById('search')
      .value
      .toLowerCase()
      .trim();


  document
    .querySelectorAll(
      '#radar-grid .radar-card'
    )
    .forEach(function(card){

      card.style.display =

        !query ||
        card.dataset.search
          .includes(query)

          ? ''
          : 'none';

    });


  updateRadarCount();


  if(
    document
      .getElementById(
        'warnings-panel'
      )
      .style.display !== 'none'
  ){

    filterWarnings();

  }else{

    document
      .querySelectorAll(
        '.warn-card'
      )
      .forEach(function(card){

        card.style.display =

          !query ||
          card.dataset.search
            .includes(query)

            ? ''
            : 'none';

      });

  }

}


document
  .getElementById('search')
  .addEventListener(
    'input',
    applySearch
  );


/* =========================================================
   SHARE RADAR
========================================================= */

function shareRadar(id){

  const url =
    SHARE_SITE +
    '?radar=' +
    encodeURIComponent(id);


  window.open(

    'https://www.facebook.com/sharer/sharer.php?u=' +
    encodeURIComponent(url),

    '_blank',

    'noopener'

  );

}


/* =========================================================
   SHARE WARNING
========================================================= */

function shareWarning(index){

  const properties =
    allAlerts[index]?.properties ||
    {};


  const url =
    SHARE_SITE +
    '?warn=' +
    encodeURIComponent(
      properties.id || ''
    );


  const quote =

    (properties.event ||
      'Weather Warning') +

    ' — ' +

    (properties.headline ||
      '');


  window.open(

    'https://www.facebook.com/sharer/sharer.php?u=' +

    encodeURIComponent(url) +

    '&quote=' +

    encodeURIComponent(quote),

    '_blank',

    'noopener'

  );

}


/* =========================================================
   DEEP LINKS
========================================================= */

function handleDeepLink(){

  const params =
    new URLSearchParams(
      location.search
    );


  const radar =
    params.get('radar');


  const warning =
    params.get('warn');


  if(
    radar &&
    RADARS.includes(
      radar.toUpperCase()
    )
  ){

    openRadar(
      radar.toUpperCase()
    );

  }


  if(warning){

    const index =
      allAlerts.findIndex(
        function(feature){

          return (

            feature.properties?.id ||
            ''

          ) === warning;

        }
      );


    if(index >= 0){

      openWarning(
        index
      );

    }

  }

}


/* =========================================================
   START APPLICATION
========================================================= */

async function start(){

  buildRadarGrid();


  await fetchWarnings();


  handleDeepLink();


  /*
    NWS alert refresh:

    60 seconds keeps the application from
    repeatedly hammering the active-alert endpoint.
  */

  setInterval(

    fetchWarnings,

    60000

  );

}


/* =========================================================
   PAGE READY
========================================================= */

window.addEventListener(

  'DOMContentLoaded',

  start

);

</script>
