function makeFallbackPolygon(areaDesc){
let stateAbbr=null;
const lower=areaDesc.toLowerCase();
for(const abbr in STATE_CENTERS){
if(lower.includes(', '+abbr)||lower.includes(' '+abbr+' ')||lower.includes(abbr+' county')){stateAbbr=abbr;break;}
}
if(!stateAbbr){
for(const name in STATE_MAP){
if(lower.includes(name)){const ab=STATE_MAP[name];if(STATE_CENTERS[ab]){stateAbbr=ab;break;}}
}
}
if(!stateAbbr) stateAbbr='mo';
const center=STATE_CENTERS[stateAbbr]||[38.5,-92.4];
const lat=center[0],lon=center[1];
const size=0.7;
return {type:'Polygon',coordinates:[[[lon-size,lat-size],[lon+size,lat-size],[lon+size,lat+size],[lon-size,lat+size],[lon-size,lat-size]]]};
}
async function fetchZoneGeometry(ugc){
if(zoneCache[ugc]) return zoneCache[ugc];
const types=['county','forecast','fire','marine','coastal'];
for(const t of types){
try{
const resp=await fetch(`https://api.weather.gov/zones/${t}/${ugc}`);
if(!resp.ok) continue;
const data=await resp.json();
if(data.geometry){zoneCache[ugc]=data.geometry; return data.geometry;}
}catch(e){continue;}
}
return null;
}
async function buildRealPolygonFromUGC(ugcList){
let mergedCoords=[];
for(const ugc of ugcList.slice(0,10)){
const geom=await fetchZoneGeometry(ugc);
if(!geom) continue;
if(geom.type==='Polygon'){mergedCoords.push(geom.coordinates);}
else if(geom.type==='MultiPolygon'){mergedCoords.push(...geom.coordinates);}
}
if(mergedCoords.length===0) return null;
if(mergedCoords.length===1){return {type:'Polygon',coordinates:mergedCoords[0]};}
else{return {type:'MultiPolygon',coordinates:mergedCoords};}
}
